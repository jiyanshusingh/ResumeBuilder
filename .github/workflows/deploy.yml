name: Deploy to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests and Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install black isort
        python -m spacy download en_core_web_sm || true

    - name: Run tests
      run: |
        RESUME_EMBEDDINGS=0 pytest tests/ -v

    - name: Check code formatting (black)
      run: |
        black --check resume_builder.py web_ui.py resume_analyzer.py ats_scorer.py jd_importer.py parse_preview.py compare.py bullet_enhancer.py tracker.py config.py app.py generate_resume.py embeddings.py

    - name: Check import sorting (isort)
      run: |
        isort --check-only resume_builder.py web_ui.py resume_analyzer.py ats_scorer.py jd_importer.py parse_preview.py compare.py bullet_enhancer.py tracker.py config.py app.py generate_resume.py embeddings.py

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy to Render
      uses: johnbatista/render-action@v0.0.22
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        git-commit: ${{ github.sha }}
        wait: true
