name: resume-builder
services:
  - type: web
    name: resume-builder
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: OUTPUT_DIR
        value: /app/output
      - key: HOST
        value: "0.0.0.0"
      - key: SHARE
        value: "false"
      - key: DEBUG
        value: "false"
      # Optional basic auth - set in Render -> Environment.
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false